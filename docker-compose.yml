services:

  # ── Anonymization proxy ──────────────────────────────────────────────────────
  proxy:
    build: .
    # Loopback-only: the proxy is never exposed to the LAN. Export VAULT_KEY in
    # your shell before `docker compose up` — do NOT put it in .env (keeps the
    # encryption passphrase off disk).
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      VAULT_KEY: ${VAULT_KEY:?VAULT_KEY must be exported (the vault is encrypted; do not store it in .env)}
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:1.7b}
      DATABASE_PATH: /app/data/pii_vault.db
      ENGAGEMENT_ID: ${ENGAGEMENT_ID:-default}
      LLM_ENABLED: ${LLM_ENABLED:-true}
    volumes:
      - proxy_data:/app/data
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

  # ── Local LLM (Ollama) ────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  proxy_data:
  ollama_models:
